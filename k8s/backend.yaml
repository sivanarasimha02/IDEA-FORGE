apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: climate-engine
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: climate-yield-engine-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: climate-engine-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: climate-engine-secrets
                  key: SECRET_KEY
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: climate-engine-config
                  key: ENVIRONMENT
            - name: OPEN_METEO_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: climate-engine-config
                  key: OPEN_METEO_BASE_URL
            - name: DEFAULT_SENSOR_GATEWAY_TOKEN
              valueFrom:
                configMapKeyRef:
                  name: climate-engine-config
                  key: DEFAULT_SENSOR_GATEWAY_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: climate-engine
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
