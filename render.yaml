# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  # Backend FastAPI API Service
  - type: web
    name: climate-engine-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt && python3 ml-engine/training/train_risk_models.py && python3 ml-engine/training/train_yield_model.py"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: climate-engine-db
          property: connectionString
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com/v1
      - key: DEFAULT_SENSOR_GATEWAY_TOKEN
        generateValue: true

  # Frontend React SPA
  - type: web
    name: climate-engine-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://climate-engine-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL with PostGIS
  - name: climate-engine-db
    databaseName: climate_yield_engine
    user: postgres
    region: oregon
    plan: starter
    postgresMajorVersion: 15
