version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: climate_engine_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-climate_yield_engine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d climate_yield_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: climate_engine_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@db:5432/climate_yield_engine}
      SECRET_KEY: ${SECRET_KEY:-dev_production_secret_key_climate_engine_2026}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1}
      COPERNICUS_API_KEY: ${COPERNICUS_API_KEY:-}
      DEFAULT_SENSOR_GATEWAY_TOKEN: ${DEFAULT_SENSOR_GATEWAY_TOKEN:-iot-gateway-dev-token-9988}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climate_engine_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
